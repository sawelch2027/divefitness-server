<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DiveFitness API</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="api-page">
    <section class="api-card">
      <p class="eyebrow">DiveFitness Backend</p>
      <h1>DiveFitness API</h1>
      <p class="intro">
        Welcome to the DiveFitness workout server. Use the links below to view
        the available API routes and workout data.
      </p>

      <div class="endpoint-grid">
        <a class="endpoint-link" href="/api/workouts">
          <span class="endpoint-title">All Workouts</span>
          <span class="endpoint-url">/api/workouts</span>
        </a>

        <a class="endpoint-link" href="/api/workouts/1">
          <span class="endpoint-title">Workout by ID</span>
          <span class="endpoint-url">/api/workouts/1</span>
        </a>
      </div>
    </section>
  </main>
</body>
</html>
